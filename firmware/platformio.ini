; Seeed Studio XIAO ESP32-S3 (Xtensa dual-core LX7, 512 KB SRAM + 8 MB OPI PSRAM, native USB).
; https://docs.platformio.org/en/latest/boards/espressif32/seeed_xiao_esp32s3.html
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
; QIO flash + OPI PSRAM — required for XIAO ESP32-S3's 8 MB PSRAM.
; This selects the correct pre-built SDK variant (sdkconfig.h lives inside
; framework-arduinoespressif32/tools/sdk/esp32s3/qio_opi/).
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
; Typing in the serial monitor: Cursor/VS Code sometimes does not forward keyboard
; input to the USB CDC port. If you cannot type RESET_WIFI here, use macOS Terminal.app
; and run the same command, or:  screen /dev/cu.usbmodemXXXX 115200
; (pick the cu.usbmodem* port from: pio device list)
monitor_eol = LF
; ARDUINO_USB_CDC_ON_BOOT routes Serial over native USB so the monitor works.
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1
; 1200bps touch: PlatformIO resets the board into bootloader and waits for the new
; CDC port. upload_flags then tell esptool NOT to reset again (board is already in
; bootloader), preventing the "port doesn't exist" race.
board_upload.use_1200bps_touch    = true
board_upload.wait_for_upload_port = true
upload_speed = 460800
upload_flags =
    --before=no_reset
    --after=hard_reset
    --chip=esp32s3
    --connect-attempts=5

lib_deps =
    fastled/FastLED@^3.7.0
    bblanchon/ArduinoJson@^7.0.0
